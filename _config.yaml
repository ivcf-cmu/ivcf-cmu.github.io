# Matt Kern is adding this file to give developers more control of what
# Jekyll is doing

# this helps the {{ 'asdf' | relative_url }} things work right
# also, helps dev testing vs prod work properly
baseurl: ""
url: "https://www.cmuintervarsity.org"

# Github pages automatically pulls in theme; using null to stop that.
# Not detrimental, deleting this line only clutters up _site directory with another css file.
theme: null

# sass settings - compresses output css
sass:
  style: compressed